<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AWS Cloud Quest</title>
<style>
:root{--navy:#14213d;--blue:#2563eb;--gold:#fca311;--ink:#172033}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f1f5fb;color:var(--ink)}header{background:var(--navy);color:white;text-align:center;padding:24px 12px;border-bottom:5px solid var(--gold)}h1{margin:0 0 5px}header p{margin:0;color:#dbeafe}main{max-width:820px;margin:24px auto;padding:0 14px}.panel{background:white;border-radius:16px;padding:clamp(18px,4vw,30px);box-shadow:0 8px 30px #14213d15}.pill{display:inline-block;background:#eaf2ff;color:#1d4ed8;border-radius:20px;padding:7px 12px;font-weight:700}.row,.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.progress{height:8px;background:#e2e8f0;border-radius:20px;margin:18px 0}.bar{height:100%;background:var(--blue);border-radius:20px}.opts{display:grid;gap:10px}.opt{padding:13px;text-align:left;border:2px solid #dbe3ef;border-radius:10px;background:white;font-size:1rem;cursor:pointer}.opt:hover:not(:disabled){border-color:var(--blue)}.opt:disabled{cursor:default}.correct{background:#f0fdf4!important;border-color:#22c55e!important}.wrong{background:#fef2f2!important;border-color:#ef4444!important}.feedback{display:none;padding:13px;margin-top:14px;border-radius:10px;line-height:1.5}.feedback.show{display:block}.good{background:#f0fdf4;color:#166534}.bad{background:#fef2f2;color:#991b1b}button.primary,button.secondary{border:0;border-radius:10px;padding:12px 17px;font-size:1rem;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:white}.primary:disabled{opacity:.45}.secondary{background:#e2e8f0;color:#1e293b}.rules{background:#f8fafc;padding:14px;border-radius:10px;text-align:left;margin:20px 0}.rules li{margin:7px 0}.start{text-align:center}.small,footer{color:#64748b;font-size:.88rem}footer{text-align:center;padding:20px}.score{font-size:3rem;color:var(--blue);font-weight:800}.review details{padding:12px;border:1px solid #e2e8f0;border-radius:9px;margin:8px 0}.review summary{cursor:pointer;font-weight:700}
</style></head><body><header><h1>☁️ AWS Cloud Quest</h1><p>Cloud Practitioner Essentials • Interactive Study Game</p></header><main><section class="panel" id="app" aria-live="polite"></section></main><footer>IT 335 • AWS Certified Cloud Practitioner exam practice</footer>
<script>
const qs=[{"q": "What is cloud computing?", "opts": ["On-demand IT resources over the internet", "Only local desktop software", "Buying a physical server for every task", "A programming language"], "a": 0, "e": "Cloud computing delivers IT resources on demand, commonly with pay-as-you-go pricing."}, {"q": "Which service provides resizable virtual servers?", "opts": ["Amazon S3", "Amazon EC2", "Amazon Route 53", "AWS CloudTrail"], "a": 1, "e": "Amazon EC2 provides virtual server instances."}, {"q": "Which service is primarily used for object storage?", "opts": ["Amazon EC2", "Amazon RDS", "Amazon S3", "AWS Lambda"], "a": 2, "e": "Amazon S3 stores objects such as files, backups, and data exports."}, {"q": "What is an AWS Region?", "opts": ["One server rack", "A geographic area containing multiple Availability Zones", "A billing report", "A user permission"], "a": 1, "e": "A Region is a geographic area made up of multiple isolated Availability Zones."}, {"q": "What is an Availability Zone?", "opts": ["One or more discrete data centers within a Region", "A DNS service", "An account type", "A support plan"], "a": 0, "e": "Availability Zones are isolated locations within a Region that help support resilience."}, {"q": "Who is responsible for customer data and IAM permissions under the shared responsibility model?", "opts": ["AWS only", "The customer", "The internet provider", "The hardware manufacturer"], "a": 1, "e": "Customers are responsible for security in the cloud, including data, identities, and configurations."}, {"q": "Which service manages users, roles, and permissions?", "opts": ["AWS IAM", "Amazon CloudFront", "S3 Glacier", "AWS Budgets"], "a": 0, "e": "IAM controls who can access AWS resources and which actions they can perform."}, {"q": "Which pricing approach charges based on usage rather than requiring upfront hardware purchases?", "opts": ["Pay-as-you-go", "Fixed lifetime hardware", "Mandatory hardware purchase", "One price for every customer"], "a": 0, "e": "Pay-as-you-go pricing aligns many costs with actual use."}, {"q": "Which service records account activity and API calls for auditing?", "opts": ["Amazon Polly", "AWS CloudTrail", "Amazon EFS", "AWS Artifact"], "a": 1, "e": "CloudTrail records AWS account activity and API events."}, {"q": "Which service runs code in response to events without managing servers?", "opts": ["EC2 Dedicated Hosts", "AWS Lambda", "Amazon VPC", "AWS Direct Connect"], "a": 1, "e": "Lambda runs code in response to events without requiring you to manage servers."}, {"q": "Which service provides a logically isolated virtual network?", "opts": ["Amazon VPC", "Amazon SQS", "Amazon Athena", "AWS Organizations"], "a": 0, "e": "A VPC defines an isolated network environment in AWS."}, {"q": "Which service is a managed relational database service?", "opts": ["Amazon RDS", "Amazon S3", "Amazon CloudFront", "AWS Shield"], "a": 0, "e": "RDS helps set up, operate, and scale relational databases."}, {"q": "Which service delivers content with low latency through edge locations?", "opts": ["Amazon CloudFront", "Amazon EBS", "AWS Config", "Amazon Redshift"], "a": 0, "e": "CloudFront is AWS's content delivery network."}, {"q": "Which service provides DNS and domain routing?", "opts": ["Amazon Route 53", "AWS WAF", "Amazon ECR", "Amazon Inspector"], "a": 0, "e": "Route 53 is a scalable DNS and domain registration service."}, {"q": "Which service helps create and manage encryption keys?", "opts": ["AWS KMS", "Amazon QuickSight", "AWS Artifact", "Amazon ECS"], "a": 0, "e": "AWS KMS lets customers create and control cryptographic keys."}, {"q": "Which service helps protect web applications from common web exploits?", "opts": ["AWS WAF", "Amazon EBS", "AWS Snowball", "Amazon Lightsail"], "a": 0, "e": "AWS WAF filters web requests using access control rules."}, {"q": "Which service provides managed DDoS protection?", "opts": ["AWS Shield", "Amazon Macie", "AWS Glue", "Amazon EFS"], "a": 0, "e": "AWS Shield helps protect applications against distributed denial-of-service attacks."}, {"q": "Which service detects potential threats by analyzing account and network activity?", "opts": ["Amazon GuardDuty", "Amazon S3", "AWS Cost Explorer", "Amazon WorkSpaces"], "a": 0, "e": "GuardDuty analyzes activity to detect potential threats."}, {"q": "Which service helps discover sensitive data stored in Amazon S3?", "opts": ["Amazon Macie", "Amazon Route 53", "AWS Batch", "Amazon SNS"], "a": 0, "e": "Macie helps discover and protect sensitive data in S3."}, {"q": "Which tool helps visualize and analyze AWS costs and usage?", "opts": ["AWS Cost Explorer", "AWS CloudFormation", "Amazon Inspector", "AWS IoT Core"], "a": 0, "e": "Cost Explorer provides views and analysis of costs and usage."}, {"q": "Which service can alert you when spending exceeds a configured threshold?", "opts": ["AWS Budgets", "AWS CloudTrail", "Amazon EKS", "AWS CodeDeploy"], "a": 0, "e": "AWS Budgets tracks costs or usage against thresholds and can send alerts."}, {"q": "Which tool recommends improvements for cost, security, performance, and fault tolerance?", "opts": ["AWS Trusted Advisor", "Amazon Polly", "AWS Snowcone", "Amazon MQ"], "a": 0, "e": "Trusted Advisor provides recommendations across several best-practice categories."}, {"q": "Which service provisions infrastructure from templates?", "opts": ["AWS CloudFormation", "Amazon Rekognition", "AWS Secrets Manager", "Amazon Connect"], "a": 0, "e": "CloudFormation manages infrastructure using templates."}, {"q": "Which service provides metrics, logs, and alarms?", "opts": ["Amazon CloudWatch", "AWS Artifact", "Amazon Route 53", "AWS Organizations"], "a": 0, "e": "CloudWatch supports monitoring, logs, metrics, and alarms."}, {"q": "Which service provides a managed message queue?", "opts": ["Amazon SQS", "Amazon EBS", "AWS IAM", "Amazon Aurora"], "a": 0, "e": "SQS decouples application components using message queues."}, {"q": "Which service supports publish/subscribe notifications?", "opts": ["Amazon SNS", "Amazon EFS", "AWS KMS", "Amazon VPC"], "a": 0, "e": "SNS supports pub/sub messaging and notifications."}, {"q": "Which service queries data in Amazon S3 using SQL without managing servers?", "opts": ["Amazon Athena", "Amazon EC2", "AWS Shield", "Amazon WorkMail"], "a": 0, "e": "Athena provides serverless SQL queries over data in S3."}, {"q": "Which AWS service is a cloud data warehouse for analytics?", "opts": ["Amazon Redshift", "Amazon Route 53", "AWS IAM", "Amazon SNS"], "a": 0, "e": "Redshift is a data warehousing service for analytics."}, {"q": "Which service helps build, train, and deploy machine-learning models?", "opts": ["Amazon SageMaker", "Amazon EBS", "AWS Artifact", "Amazon Lightsail"], "a": 0, "e": "SageMaker provides tools to develop and deploy machine-learning models."}, {"q": "Which service can transfer large datasets using physical devices?", "opts": ["AWS Snowball", "Amazon CloudFront", "AWS WAF", "Amazon Cognito"], "a": 0, "e": "Snowball devices can help transfer large datasets when network transfer is impractical."}, {"q": "Which service provides a managed Kubernetes control plane?", "opts": ["Amazon EKS", "Amazon S3", "Amazon Macie", "AWS Budgets"], "a": 0, "e": "Amazon EKS is a managed Kubernetes service."}, {"q": "Which combination can run containers without managing underlying servers?", "opts": ["Amazon ECS with AWS Fargate", "Amazon Route 53", "AWS CloudTrail", "Amazon EBS"], "a": 0, "e": "ECS with Fargate runs containers without managing the underlying server infrastructure."}, {"q": "Which service provides block storage volumes for EC2 instances?", "opts": ["Amazon EBS", "Amazon S3", "S3 Glacier", "Amazon SNS"], "a": 0, "e": "EBS provides persistent block storage for EC2."}, {"q": "Which service provides shared elastic file storage?", "opts": ["Amazon EFS", "Amazon SQS", "AWS KMS", "Amazon Athena"], "a": 0, "e": "EFS provides elastic shared file storage."}, {"q": "Which service helps manage multiple AWS accounts centrally?", "opts": ["AWS Organizations", "Amazon Polly", "Amazon EBS", "AWS Glue"], "a": 0, "e": "AWS Organizations helps centrally manage and govern multiple accounts."}, {"q": "Which service provides access to AWS compliance reports?", "opts": ["AWS Artifact", "Amazon GuardDuty", "Amazon SQS", "AWS Lambda"], "a": 0, "e": "AWS Artifact provides access to AWS compliance reports and certain agreements."}, {"q": "Which AWS Support plan includes a designated Technical Account Manager as a standard feature?", "opts": ["Basic", "Developer", "Enterprise Support", "No support plan"], "a": 2, "e": "Enterprise Support includes a designated Technical Account Manager."}, {"q": "Which design approach helps a workload recover from component failure?", "opts": ["Design for failure and use redundancy", "Use one Availability Zone only", "Disable monitoring", "Avoid backups"], "a": 0, "e": "Resilient designs use redundancy, monitoring, and recovery mechanisms."}];let order=[],idx=0,score=0,answered=false,review=[];
const app=document.getElementById('app');
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function home(){app.innerHTML=`<div class="start"><span class="pill">${qs.length} questions</span><h2>Ready to test your AWS knowledge?</h2><p>Practise cloud concepts, AWS services, security, pricing, monitoring, and architecture.</p><div class="rules"><b>How to play</b><ol><li>Choose one answer for each question.</li><li>Read the feedback and explanation.</li><li>Each correct answer earns one point.</li><li>At the end, review your answers and restart to try again.</li></ol></div><button class="primary" onclick="start()">Start Game</button><p class="small">Questions are shuffled each time you play.</p></div>`}
function start(){order=qs.map((_,i)=>i);for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}idx=score=0;review=[];draw()}
function draw(){answered=false;let q=qs[order[idx]];app.innerHTML=`<div class="row"><span class="pill">Question ${idx+1} of ${qs.length}</span><span class="pill">Score: ${score}</span></div><div class="progress"><div class="bar" style="width:${idx/qs.length*100}%"></div></div><h2>${safe(q.q)}</h2><div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${String.fromCharCode(65+i)}. ${safe(o)}</button>`).join('')}</div><div class="feedback" id="fb"></div><div class="actions" style="margin-top:20px"><button class="secondary" onclick="restart()">Restart</button><button class="primary" id="next" disabled onclick="next()">${idx===qs.length-1?'See Results':'Next Question'}</button></div>`;app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i))}
function answer(n){if(answered)return;answered=true;let q=qs[order[idx]],ok=n===q.a;if(ok)score++;review.push({q,choice:n,ok});app.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('correct');if(i===n&&!ok)b.classList.add('wrong')});let f=document.getElementById('fb');f.className='feedback show '+(ok?'good':'bad');f.innerHTML=`<b>${ok?'Correct! +1 point':'Not quite.'}</b> ${safe(q.e)}`;document.getElementById('next').disabled=false;app.querySelector('.row .pill:last-child').textContent='Score: '+score}
function next(){if(!answered)return;if(++idx>=qs.length)results();else draw()}
function results(){let p=Math.round(score/qs.length*100);app.innerHTML=`<div class="start"><span class="pill">Game complete</span><h2>Your result</h2><div class="score">${score}/${qs.length}</div><p><b>${p}% correct</b></p><p>${p>=90?'Excellent work!':p>=75?'Good work. Review missed questions.':'Keep practising. Read the explanations and try again.'}</p><button class="primary" onclick="start()">Play Again</button></div><div class="review"><h2>Answer review</h2>${review.map((r,i)=>`<details><summary>${r.ok?'✅':'❌'} ${i+1}. ${safe(r.q.q)}</summary><p><b>Your answer:</b> ${safe(r.q.opts[r.choice])}</p><p><b>Correct answer:</b> ${safe(r.q.opts[r.q.a])}</p><p>${safe(r.q.e)}</p></details>`).join('')}</div>`}
function restart(){if(confirm('Restart the game? Your current score will be lost.'))home()}
home();
</script></body></html>
